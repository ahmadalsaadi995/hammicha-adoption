<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Ahmad Al-Sadi">
<meta name="copyright" content="© 2024 Ahmad Al-Sadi. All Rights Reserved.">
<title>Hammicha: Amman Dash — Global Viral Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-dark: #0f172a;
    --neon-pink: #f472b6;
    --neon-blue: #38bdf8;
    --neon-yellow: #fbbf24;
    --accent: #d97736;
  }
  *{box-sizing:border-box;margin:0;padding:0; user-select: none;}
  
  body{
    font-family:'Poppins', system-ui, sans-serif;
    background-color: #1e1b4b;
    background-image: radial-gradient(circle at 50% 0%, #4c1d95 0%, #0f172a 100%);
    color: white;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; overflow: hidden;
  }
  
  .game-container {
    position: relative;
    width: 100%; max-width: 900px;
    height: 100vh; max-height: 600px;
    background: #0f172a;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 0 0 4px #334155;
    display: flex; flex-direction: column;
  }

  @media (max-width: 900px) {
    .game-container { border-radius: 0; height: 100vh; max-height: none; box-shadow: none; }
  }

  canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

  /* --- HUD (Heads Up Display) --- */
  .hud {
    position: absolute; top: 0; left: 0; width: 100%; padding: 20px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 10;
  }
  .score-box {
    background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px);
    padding: 10px 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
    text-align: left;
  }
  .score-box h4 { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;}
  .score-box .score-val { font-size: 2rem; font-weight: 900; color: white; line-height: 1;}
  
  .yarn-meter-container {
    background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px);
    padding: 10px 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
    display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .yarn-meter-bar {
    width: 150px; height: 12px; background: #334155; border-radius: 10px; overflow: hidden;
  }
  .yarn-meter-fill {
    height: 100%; width: 0%; background: linear-gradient(90deg, #f472b6, #ef4444);
    transition: width 0.2s;
  }
  .yarn-text { font-size: 0.8rem; font-weight: 700; color: #f472b6; }

  /* Overdrive Button */
  #overdriveBtn {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%) scale(0);
    background: linear-gradient(135deg, #fbbf24, #ef4444);
    color: white; border: 3px solid #fff; padding: 15px 40px; border-radius: 50px;
    font-weight: 900; font-size: 1.2rem; letter-spacing: 2px; cursor: pointer;
    box-shadow: 0 10px 25px rgba(239, 68, 68, 0.6), 0 0 20px rgba(251, 191, 36, 0.4);
    z-index: 20; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    animation: pulse 1.5s infinite;
  }
  #overdriveBtn.active { transform: translateX(-50%) scale(1); }
  #overdriveBtn:active { transform: translateX(-50%) scale(0.95); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
    70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
    100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
  }

  /* --- Overlays --- */
  .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 50; text-align: center; padding: 20px; transition: opacity 0.3s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  
  .overlay h1 {
    font-size: 3rem; font-weight: 900; line-height: 1.1; margin-bottom: 10px;
    background: linear-gradient(to right, #f472b6, #fbbf24);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0px 4px 10px rgba(244,114,182,0.3));
  }
  .overlay h2 { font-size: 2rem; color: white; margin-bottom: 20px;}
  .overlay p { color: #cbd5e1; font-size: 1.1rem; margin-bottom: 30px; max-width: 500px;}
  
  .btn {
    background: linear-gradient(135deg, #f97316, #ef4444); color: white;
    border: none; padding: 15px 40px; border-radius: 50px;
    font-weight: 900; font-size: 1.2rem; cursor: pointer; letter-spacing: 1px;
    box-shadow: 0 10px 20px -5px rgba(239, 68, 68, 0.5); transition: transform 0.1s;
    text-transform: uppercase; margin-bottom: 15px;
  }
  .btn:active { transform: translateY(3px); }
  .btn-share { background: #25D366; box-shadow: 0 10px 20px -5px rgba(37, 211, 102, 0.5); font-size: 1rem; padding: 12px 30px;}

  /* Screen Shake */
  .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shake {
    10%, 90% { transform: translate3d(-2px, 0, 0); }
    20%, 80% { transform: translate3d(4px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
    40%, 60% { transform: translate3d(8px, 0, 0); }
  }
</style>
</head>
<body>

<div class="game-container" id="gameContainer">
  <div class="hud">
    <div class="score-box">
      <h4>Score</h4>
      <div class="score-val" id="scoreDisplay">0</div>
    </div>
    <div class="yarn-meter-container">
      <span class="yarn-text">Yarn Overdrive 🧶</span>
      <div class="yarn-meter-bar"><div class="yarn-meter-fill" id="yarnFill"></div></div>
    </div>
  </div>

  <button id="overdriveBtn" onclick="activateOverdrive()">GO SUPER!</button>

  <canvas id="gameCanvas"></canvas>

  <!-- Start Screen -->
  <div class="overlay" id="startScreen">
    <h1>Hammicha:<br>Amman Dash</h1>
    <p>Help Hammicha run through the streets of Amman. Collect yarn to go Super-Cat, dodge obstacles, and chase the high score!</p>
    <button class="btn" onclick="startGame()">Play Now</button>
    <p style="font-size: 0.9rem; color: #94a3b8; margin-top: 10px;">Tap to Jump • Tap again to Double Jump</p>
  </div>

  <!-- Game Over Screen -->
  <div class="overlay hidden" id="gameOverScreen">
    <h2>Meow! Game Over</h2>
    <p>You scored <strong id="finalScore" style="color:#fbbf24; font-size:1.5rem;">0</strong> points!</p>
    <p style="font-size: 0.9rem;">Best Score: <span id="highScore" style="color:#38bdf8;">0</span></p>
    <button class="btn" onclick="startGame()">Try Again</button>
    <button class="btn btn-share" onclick="shareScore()">Brag on WhatsApp 📲</button>
  </div>
</div>

<script>
  console.log("%c© 2024 Ahmad Al-Sadi. All Rights Reserved.", "color: #ef4444; font-size: 24px; font-weight: bold;");
  console.log("%cThe code, design, and mechanics of 'Hammicha: Amman Dash' are the intellectual property of the author.", "color: #f97316; font-size: 14px;");

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('gameContainer');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const yarnFill = document.getElementById('yarnFill');
  const overdriveBtn = document.getElementById('overdriveBtn');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');

  let cw = canvas.width = container.clientWidth;
  let ch = canvas.height = container.clientHeight;

  window.addEventListener('resize', () => {
    cw = canvas.width = container.clientWidth;
    ch = canvas.height = container.clientHeight;
  });

  // --- GAME STATE ---
  let isPlaying = false;
  let score = 0;
  let speed = 6;
  let frames = 0;
  let highScore = localStorage.getItem('hammichaHighScore') || 0;
  
  let yarnCount = 0;
  let isOverdrive = false;
  let overdriveTimer = 0;

  // --- ENTITIES ---
  const player = {
    x: 100, y: 0, width: 44, height: 44,
    vy: 0, gravity: 0.7, jumpForce: -14,
    jumpsLeft: 2, rotation: 0, scaleX: 1, scaleY: 1,
    isJumping: false, isFlying: false
  };

  let obstacles = [];
  let yarns = [];
  let particles = [];
  let bgOffset = 0;

  // Colors
  const colors = {
    bus: '#eab308', busStripe: '#ef4444',
    cucumber: '#22c55e', cucumberDark: '#166534',
    cat: '#8b5cf6', catEyes: '#fbbf24',
    mouse: '#f8fafc', mouseEar: '#f472b6'
  };

  function startGame() {
    isPlaying = true;
    score = 0;
    speed = 6;
    frames = 0;
    yarnCount = 0;
    isOverdrive = false;
    overdriveTimer = 0;
    obstacles = [];
    yarns = [];
    particles = [];
    
    player.y = ch - 80;
    player.vy = 0;
    player.jumpsLeft = 2;
    player.isFlying = false;
    player.scaleX = 1; player.scaleY = 1;

    scoreDisplay.innerText = "0";
    yarnFill.style.width = "0%";
    overdriveBtn.classList.remove('active');
    
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');

    loop();
  }

  function jump() {
    if (!isPlaying) return;
    
    if (player.jumpsLeft > 0) {
      player.vy = player.jumpsLeft === 2 ? player.jumpForce : player.jumpForce * 0.85;
      player.jumpsLeft--;
      player.isJumping = true;
      
      // Juice: Squash and stretch
      player.scaleX = 0.8; player.scaleY = 1.3;
      
      // Juice: Particles
      for(let i=0; i<10; i++) {
        particles.push({
          x: player.x + player.width/2, y: player.y + player.height,
          vx: (Math.random()-0.5)*6, vy: Math.random()*-4,
          life: 20, color: '#cbd5e1', size: Math.random()*4+2
        });
      }
    }
  }

  // Input handling
  canvas.addEventListener('mousedown', jump);
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); jump(); }
    if (e.code === 'KeyE' && !overdriveBtn.classList.contains('active') === false) activateOverdrive();
  });

  // --- GAME LOOP ---
  function loop() {
    if (!isPlaying) return;
    frames++;

    // Clear Canvas
    ctx.clearRect(0, 0, cw, ch);

    // 1. Draw Parallax Background (Static image illusion)
    drawBackground();

    // 2. Physics & Player Update
    if (!isOverdrive) {
      player.vy += player.gravity;
      player.y += player.vy;
    } else {
      // Fly in overdrive
      player.y = ch - 150 + Math.sin(frames * 0.1) * 30;
      // Rainbow trail
      particles.push({
        x: player.x, y: player.y + 20,
        vx: -speed, vy: (Math.random()-0.5)*4,
        life: 30, color: `hsl(${frames % 360}, 100%, 60%)`, size: 8
      });
    }

    // Smoothly recover scale (Squash/Stretch)
    player.scaleX += (1 - player.scaleX) * 0.15;
    player.scaleY += (1 - player.scaleY) * 0.15;

    // Ground Collision
    const groundY = ch - 60;
    if (player.y > groundY - player.height && !isOverdrive) {
      player.y = groundY - player.height;
      player.vy = 0;
      player.jumpsLeft = 2; 
      if (player.isJumping) {
        player.scaleX = 1.3; player.scaleY = 0.7; // Squash on land
        player.isJumping = false;
      }
    }

    // Rotation (Flip on double jump)
    if (player.jumpsLeft === 0 && !isOverdrive) {
      player.rotation += 0.15;
    } else {
      player.rotation = 0;
    }

    // 3. Spawning Logic
    // Obstacles
    if (frames % Math.floor(100 - speed * 3) === 0) {
      let types = ['bus', 'mouse', 'cucumber', 'cat'];
      let type = types[Math.floor(Math.random() * types.length)];
      let w = type === 'bus' ? 60 : (type === 'cucumber' ? 45 : 30);
      let h = type === 'bus' ? 40 : (type === 'cucumber' ? 15 : 25);
      
      obstacles.push({ x: cw, y: groundY - h, width: w, height: h, type: type });
    }

    // Yarn
    if (frames % 80 === 0) {
      yarns.push({ 
        x: cw, 
        y: groundY - 100 - Math.random() * 80, 
        radius: 15,
        pulse: Math.random() * Math.PI
      });
    }

    // 4. Update & Draw Obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
      let obs = obstacles[i];
      obs.x -= speed;
      drawObstacle(obs);

      // Collision
      if (!isOverdrive) {
        // Juice: Forgiving hitboxes (shrunk by 10px)
        if (
          player.x + 10 < obs.x + obs.width &&
          player.x + player.width - 10 > obs.x &&
          player.y + 10 < obs.y + obs.height &&
          player.y + player.height > obs.y
        ) {
          gameOver();
        }
      }

      if (obs.x + obs.width < 0) {
        obstacles.splice(i, 1);
        score += 10;
        scoreDisplay.innerText = score;
      }
    }

    // 5. Update & Draw Yarn
    for (let i = yarns.length - 1; i >= 0; i--) {
      let y = yarns[i];
      y.x -= speed;
      y.pulse += 0.1;
      
      // Draw glowing yarn
      ctx.save();
      ctx.translate(y.x, y.y);
      ctx.rotate(y.pulse);
      ctx.shadowColor = '#f472b6';
      ctx.shadowBlur = 15;
      ctx.fillStyle = '#f472b6';
      ctx.beginPath(); ctx.arc(0, 0, y.radius, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-5, -5, 5, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      // Collision
      let dx = player.x + player.width/2 - y.x;
      let dy = player.y + player.height/2 - y.y;
      let dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < y.radius + 20) {
        yarns.splice(i, 1);
        collectYarn(y.x, y.y);
      }
    }

    // 6. Update & Draw Particles (Juice)
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
      
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life / 30;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;

      if (p.life <= 0) particles.splice(i, 1);
    }

    // 7. Draw Player
    ctx.save();
    ctx.translate(player.x + player.width/2, player.y + player.height/2);
    ctx.rotate(player.rotation);
    ctx.scale(player.scaleX, player.scaleY);
    
    // Overdrive Aura
    if (isOverdrive) {
      ctx.shadowColor = `hsl(${frames % 360}, 100%, 50%)`;
      ctx.shadowBlur = 30;
    }
    
    drawHammicha(-player.width/2, -player.height/2);
    ctx.restore();

    // 8. Manage Overdrive
    if (isOverdrive) {
      overdriveTimer--;
      if (overdriveTimer <= 0) {
        isOverdrive = false;
        overdriveBtn.classList.remove('active');
      }
    }

    requestAnimationFrame(loop);
  }

  // --- MECHANICS ---
  function collectYarn(x, y) {
    score += 50;
    scoreDisplay.innerText = score;
    
    // Juice: Explosion
    for(let i=0; i<15; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
        life: 25, color: Math.random() > 0.5 ? '#f472b6' : '#fbbf24', size: Math.random()*5+2
      });
    }

    if (!isOverdrive) {
      yarnCount++;
      yarnFill.style.width = (yarnCount * 10) + "%";
      
      if (yarnCount >= 10) {
        overdriveBtn.classList.add('active');
      }
    }
  }

  function activateOverdrive() {
    if (!isPlaying || isOverdrive || yarnCount < 10) return;
    
    isOverdrive = true;
    overdriveTimer = 300; // 5 seconds at 60fps
    yarnCount = 0;
    yarnFill.style.width = "0%";
    overdriveBtn.classList.remove('active');
    
    // Juice: Screen shake and burst
    container.classList.add('shake');
    setTimeout(() => container.classList.remove('shake'), 400);
    
    for(let i=0; i<30; i++) {
      particles.push({
        x: player.x + 20, y: player.y + 20,
        vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15,
        life: 40, color: '#fbbf24', size: Math.random()*8+4
      });
    }
  }

  function gameOver() {
    isPlaying = false;
    
    // Juice: Screen shake
    container.classList.add('shake');
    setTimeout(() => container.classList.remove('shake'), 400);

    // Set High Score
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('hammichaHighScore', highScore);
    }
    
    document.getElementById('finalScore').innerText = score;
    document.getElementById('highScore').innerText = highScore;
    
    setTimeout(() => {
      gameOverScreen.classList.remove('hidden');
    }, 500);
  }

  function shareScore() {
    let text = `I scored ${score} points in Hammicha: Amman Dash! 🐾 Can you beat my high score? Play here: ${window.location.href}`;
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
  }

  // --- DRAWING GRAPHICS ---
  function drawBackground() {
    // Sky Gradient
    let grad = ctx.createLinearGradient(0, 0, 0, ch);
    grad.addColorStop(0, '#4c1d95'); // Purple
    grad.addColorStop(0.5, '#be123c'); // Deep Pink
    grad.addColorStop(1, '#f97316'); // Orange
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, cw, ch);

    // Sun/Moon
    ctx.fillStyle = '#fef08a';
    ctx.shadowColor = '#fef08a';
    ctx.shadowBlur = 50;
    ctx.beginPath(); ctx.arc(cw - 100, 100, 40, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    // Parallax Layer 1: Jordanian Flag (Waving slowly)
    drawJordanianFlag(cw - 250, 80, frames);

    // Parallax Layer 2: Amman Skyline
    let skylineSpeed = isOverdrive ? speed * 0.5 : speed * 0.2;
    bgOffset = (bgOffset + skylineSpeed) % cw;
    
    ctx.fillStyle = '#1e1b4b';
    // Citadel
    ctx.fillRect(cw - bgOffset + 50, ch - 150, 80, 90);
    ctx.beginPath(); ctx.arc(cw - bgOffset + 90, ch - 150, 40, Math.PI, 0); ctx.fill();
    
    // Roman Theatre
    ctx.fillRect(cw - bgOffset + cw * 0.4, ch - 110, 120, 50);
    ctx.beginPath(); ctx.arc(cw - bgOffset + cw * 0.4 + 60, ch - 110, 60, Math.PI, 0); ctx.fill();
    
    // Repeat Skyline for seamless loop
    ctx.fillRect(cw - bgOffset + cw + 50, ch - 150, 80, 90);
    ctx.beginPath(); ctx.arc(cw - bgOffset + cw + 90, ch - 150, 40, Math.PI, 0); ctx.fill();
    ctx.fillRect(cw - bgOffset + cw * 1.4, ch - 110, 120, 50);
    ctx.beginPath(); ctx.arc(cw - bgOffset + cw * 1.4 + 60, ch - 110, 60, Math.PI, 0); ctx.fill();

    // Ground
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, ch - 60, cw, 60);
    
    // Neon Ground Line
    ctx.fillStyle = '#38bdf8';
    ctx.shadowColor = '#38bdf8';
    ctx.shadowBlur = 15;
    ctx.fillRect(0, ch - 60, cw, 3);
    ctx.shadowBlur = 0;
  }

  function drawHammicha(x, y) {
    // Body
    ctx.fillStyle = '#d97736';
    ctx.beginPath(); ctx.roundRect(x + 5, y + 10, 34, 34, 15); ctx.fill();

    // Belly
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.roundRect(x + 10, y + 25, 24, 19, 10); ctx.fill();

    // Head
    ctx.fillStyle = '#d97736';
    ctx.beginPath(); ctx.arc(x + 22, y + 15, 20, 0, Math.PI * 2); ctx.fill();

    // Ears
    ctx.beginPath(); ctx.moveTo(x + 5, y + 5); ctx.lineTo(x + 12, y - 15); ctx.lineTo(x + 20, y + 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 39, y + 5); ctx.lineTo(x + 32, y - 15); ctx.lineTo(x + 24, y + 2); ctx.fill();

    // Face
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(x + 22, y + 20, 8, 10, 0, 0, Math.PI * 2); ctx.fill();

    // Eyes
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(x + 15, y + 13, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 29, y + 13, 3, 0, Math.PI*2); ctx.fill();
    
    // Glint
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x + 14, y + 12, 1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 28, y + 12, 1, 0, Math.PI*2); ctx.fill();

    // Nose
    ctx.fillStyle = '#f472b6';
    ctx.beginPath(); ctx.moveTo(x + 20, y + 18); ctx.lineTo(x + 24, y + 18); ctx.lineTo(x + 22, y + 20); ctx.fill();

    // Tail
    ctx.strokeStyle = '#d97736'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y + 35);
    ctx.quadraticCurveTo(x - 15, y + (player.isJumping ? 10 : 35), x - 15, y + (player.isJumping ? 0 : 20));
    ctx.stroke();
  }

  function drawObstacle(obs) {
    ctx.save();
    if (obs.type === 'bus') {
      // BRT Bus
      ctx.fillStyle = colors.bus; 
      ctx.beginPath(); ctx.roundRect(obs.x, obs.y + 5, obs.width, obs.height - 5, 8); ctx.fill();
      ctx.fillStyle = colors.busStripe; 
      ctx.fillRect(obs.x + 2, obs.y + obs.height - 12, obs.width - 4, 8);
      // Windows
      ctx.fillStyle = '#0f172a';
      ctx.beginPath(); ctx.roundRect(obs.x + 8, obs.y + 10, 12, 10, 3); ctx.fill();
      ctx.beginPath(); ctx.roundRect(obs.x + 25, obs.y + 10, 12, 10, 3); ctx.fill();
      // Wheels
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(obs.x + 15, obs.y + obs.height, 6, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(obs.x + obs.width - 15, obs.y + obs.height, 6, 0, Math.PI*2); ctx.fill();
    } 
    else if (obs.type === 'mouse') {
      // Toy Mouse
      ctx.fillStyle = colors.mouse; 
      ctx.beginPath(); ctx.ellipse(obs.x + 15, obs.y + 15, 15, 10, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(obs.x + 5, obs.y + 10, 6, 0, Math.PI*2); ctx.fill(); // Ear
      ctx.strokeStyle = colors.mouseEar; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(obs.x + 28, obs.y + 20); ctx.lineTo(obs.x + 35, obs.y + 25); ctx.stroke(); // Tail
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(obs.x + 22, obs.y + 12, 2, 0, Math.PI*2); ctx.fill(); // Eye
    } 
    else if (obs.type === 'cucumber') {
      // Cucumber
      ctx.fillStyle = colors.cucumber; 
      ctx.beginPath(); ctx.roundRect(obs.x, obs.y, obs.width, obs.height, 8); ctx.fill();
      ctx.fillStyle = colors.cucumberDark;
      ctx.fillRect(obs.x + 10, obs.y + 2, 3, obs.height - 4);
      ctx.fillRect(obs.x + 20, obs.y + 2, 3, obs.height - 4);
      ctx.fillRect(obs.x + 30, obs.y + 2, 3, obs.height - 4);
    } 
    else if (obs.type === 'cat') {
      // Rival Cat
      ctx.fillStyle = colors.cat; 
      ctx.beginPath(); ctx.roundRect(obs.x + 5, obs.y + 10, 20, 15, 5); ctx.fill();
      ctx.beginPath(); ctx.arc(obs.x + 15, obs.y + 10, 10, 0, Math.PI*2); ctx.fill(); 
      // Ears
      ctx.beginPath(); ctx.moveTo(obs.x + 5, obs.y + 5); ctx.lineTo(obs.x + 10, obs.y - 5); ctx.lineTo(obs.x + 15, obs.y + 5); ctx.fill();
      ctx.beginPath(); ctx.moveTo(obs.x + 25, obs.y + 5); ctx.lineTo(obs.x + 20, obs.y - 5); ctx.lineTo(obs.x + 15, obs.y + 5); ctx.fill();
      // Eyes
      ctx.fillStyle = colors.catEyes; 
      ctx.beginPath(); ctx.arc(obs.x + 10, obs.y + 8, 2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(obs.x + 20, obs.y + 8, 2, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function drawJordanianFlag(x, y, time) {
    // Pole
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(x, y, 6, 120);
    ctx.beginPath(); ctx.arc(x + 3, y, 6, 0, Math.PI*2); ctx.fill();

    // Waving Flag Logic
    ctx.save();
    let w = 80; // Flag width
    
    // Black Stripe
    ctx.beginPath();
    ctx.moveTo(x + 6, y);
    for (let i = 0; i <= w; i++) {
      let wave = Math.sin((i * 0.1) + (time * 0.05)) * 5;
      ctx.lineTo(x + 6 + i, y + wave);
    }
    for (let i = w; i >= 0; i--) {
      let wave = Math.sin((i * 0.1) + (time * 0.05)) * 5;
      ctx.lineTo(x + 6 + i, y + 15 + wave);
    }
    ctx.fillStyle = '#000'; ctx.fill();
    
    // White Stripe
    ctx.beginPath();
    ctx.moveTo(x + 6, y + 15);
    for (let i = 0; i <= w; i++) {
      let wave = Math.sin((i * 0.1) + (time * 0.05)) * 5;
      ctx.lineTo(x + 6 + i, y + 15 + wave);
    }
    for (let i = w; i >= 0; i--) {
      let wave = Math.sin((i * 0.1) + (time * 0.05)) * 5;
      ctx.lineTo(x + 6 + i, y + 30 + wave);
    }
    ctx.fillStyle = '#fff'; ctx.fill();

    // Green Stripe
    ctx.beginPath();
    ctx.moveTo(x + 6, y + 30);
    for (let i = 0; i <= w; i++) {
      let wave = Math.sin((i * 0.1) + (time * 0.05)) * 5;
      ctx.lineTo(x + 6 + i, y + 30 + wave);
    }
    for (let i = w; i >= 0; i--) {
      let wave = Math.sin((i * 0.1) + (time * 0.05)) * 5;
      ctx.lineTo(x + 6 + i, y + 45 + wave);
    }
    ctx.fillStyle = '#10b981'; ctx.fill();

    // Red Triangle
    ctx.beginPath();
    ctx.moveTo(x + 6, y);
    ctx.lineTo(x + 45, y + 22.5);
    ctx.lineTo(x + 6, y + 45);
    ctx.fillStyle = '#ef4444'; ctx.fill();
    
    // White 7-Pointed Star
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    let cx = x + 18;
    let cy = y + 22.5;
    let outerR = 7;
    let innerR = 3;
    for (let i = 0; i < 14; i++) {
      let r = i % 2 === 0 ? outerR : innerR;
      let angle = (i * Math.PI) / 7 - Math.PI / 2;
      let px = cx + Math.cos(angle) * r;
      let py = cy + Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    
    ctx.restore();
  }
